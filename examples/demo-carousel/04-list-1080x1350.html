<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>04-list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5..100,400..600;1,62.5..100,400..600&family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;position:relative;overflow:hidden;
       background:#F5F0E6;-webkit-font-smoothing:antialiased}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
      object-position:center 32%}
  .scrim{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(18,8,7,0.86) 0%, rgba(18,8,7,0.72) 40%, rgba(18,8,7,0.3) 65%, transparent 84%)}
  .frame{position:absolute;inset:38px;
         border:1.5px solid rgba(255,255,255,.34);
         border-radius:6px;pointer-events:none}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;
        justify-content:flex-start;padding:175px 89.64px 0;
        align-items:flex-start;}
  .eyebrow{font-family:'Montserrat',serif;font-weight:500;
           font-size:26px;letter-spacing:.22em;word-spacing:.5em;text-transform:uppercase;
           color:#F7F1E7;opacity:.88;margin-bottom:26px;text-shadow:0 2px 10px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.7);}
  .kicker{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;
          font-size:40px;color:#F7F1E7;line-height:1.3;
          margin-bottom:16px;text-shadow:0 2px 10px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.7);}
  .head{font-family:'Noto Serif Display',serif;font-stretch:extra-condensed;font-weight:600;
        font-size:88px;line-height:1.06;color:#F7F1E7;
        text-shadow:0 2px 10px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.7);}
  .head em{font-style:italic;font-weight:600;-webkit-text-stroke:1px rgba(0,0,0,.5);paint-order:stroke fill;}
  .sub{font-family:'Playfair Display',serif;font-size:39px;
       line-height:1.42;color:#F7F1E7;margin-top:25px;
       opacity:.97;text-shadow:0 2px 10px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.7);}
  .sub em{font-style:italic;-webkit-text-stroke:1px rgba(0,0,0,.5);paint-order:stroke fill;}
  .list{font-family:'Playfair Display',serif;font-style:italic;
        font-size:37px;line-height:1.62;color:#F7F1E7;
        margin-top:23px;text-shadow:0 2px 10px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.7);}
  .list .dot{color:#E8218A;font-style:normal;margin-right:14px;-webkit-text-stroke:1px rgba(0,0,0,.5);paint-order:stroke fill;}
  .close{font-family:'Playfair Display',serif;font-size:39px;
         line-height:1.4;color:#F7F1E7;margin-top:23px;text-shadow:0 2px 10px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.7);}
  .close em{font-style:italic;-webkit-text-stroke:1px rgba(0,0,0,.5);paint-order:stroke fill;}
  .cta{font-family:'Noto Serif Display',serif;font-stretch:extra-condensed;font-style:italic;
       font-weight:600;font-size:55px;line-height:1.12;
       color:#E8218A;margin-top:30px;text-shadow:0 2px 10px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.7);-webkit-text-stroke:1px rgba(0,0,0,.5);paint-order:stroke fill;}
  
</style></head>
<body>
  <img class="bg" src="photos/04-clay.jpg" alt="">
  <div class="scrim"></div>
  <div class="frame"></div>
  <div class="wrap"><div class="head">What changes when it has a shape:</div>
    <div class="list"><span class="dot">&#10022;</span>you stop deciding the same thing twice<br><span class="dot">&#10022;</span>the work survives a bad week<br><span class="dot">&#10022;</span>you can hand a piece of it to someone else<br><span class="dot">&#10022;</span>you can see what is missing</div>
    <div class="close">None of that requires <em style="color:#E8218A">more hours.</em></div></div>
</body></html>
