<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>05-solid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5..100,400..600;1,62.5..100,400..600&family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;position:relative;overflow:hidden;
       background:#F5F0E6;-webkit-font-smoothing:antialiased}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
      object-position:center 35%}
  .scrim{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(18,8,7,0.86) 0%, rgba(18,8,7,0.72) 35%, rgba(18,8,7,0.3) 58%, transparent 75%)}
  .frame{position:absolute;inset:38px;
         border:1.5px solid #2A141040;
         border-radius:6px;pointer-events:none}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;
        justify-content:flex-start;padding:175px 89.64px 0;
        align-items:flex-start;}
  .eyebrow{font-family:'Montserrat',serif;font-weight:500;
           font-size:26px;letter-spacing:.22em;word-spacing:.5em;text-transform:uppercase;
           color:#2A1410;opacity:.88;margin-bottom:26px;}
  .kicker{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;
          font-size:40px;color:#2A1410;line-height:1.3;
          margin-bottom:16px;}
  .head{font-family:'Noto Serif Display',serif;font-stretch:extra-condensed;font-weight:600;
        font-size:88px;line-height:1.06;color:#2A1410;
        }
  .head em{font-style:italic;font-weight:600;}
  .sub{font-family:'Playfair Display',serif;font-size:39px;
       line-height:1.42;color:#2A1410;margin-top:25px;
       opacity:.97;}
  .sub em{font-style:italic;}
  .list{font-family:'Playfair Display',serif;font-style:italic;
        font-size:37px;line-height:1.62;color:#2A1410;
        margin-top:23px;}
  .list .dot{color:#E8218A;font-style:normal;margin-right:14px;}
  .close{font-family:'Playfair Display',serif;font-size:39px;
         line-height:1.4;color:#2A1410;margin-top:23px;}
  .close em{font-style:italic;}
  .cta{font-family:'Noto Serif Display',serif;font-stretch:extra-condensed;font-style:italic;
       font-weight:600;font-size:55px;line-height:1.12;
       color:#E8218A;margin-top:30px;}
  
</style></head>
<body>
  
  
  <div class="frame"></div>
  <div class="wrap"><div class="eyebrow">Your Brand</div>
    <div class="head">A slide with no photo works too.</div>
    <div class="sub">Leave <em style="color:#E8218A">photo</em> out and it uses your background colour instead. Useful for a quote, a definition, or a breath between images.</div></div>
</body></html>
